[project]
name = "comfyui-raon-opentts"
description = "ComfyUI nodes for KRAFTON Raon-OpenTTS (F5-TTS-style CFM/DiT) with INT8 ConvRot quantization support via comfy-kitchen"
version = "1.1.1"
license = { text = "MIT" }
dependencies = [
    "numpy",
    "safetensors",
    "pyyaml",
    "torchdiffeq",
    "jieba",
    "pypinyin",
    "pydub",
    "soundfile",
    "huggingface_hub",
    "accelerate",
    "transformers",
    "comfy-kitchen",
]

[project.urls]
Repository = "https://github.com/Saganaki22/ComfyUI-Raon-OpenTTS"

[tool.comfy]
PublisherId = "saganaki22"
DisplayName = "ComfyUI-Raon-OpenTTS"
Icon = "https://avatars.githubusercontent.com/u/84208527"
